services:
  tower-finder-service:
    build:
      context: .
      args:
        # The CARTO basemap key, public by design — it ends up in the bundle,
        # because the tile requests are the browser's. Resolved from ./.env,
        # which every deploy rewrites from deploy/env.<env>.example and then
        # tops up from the host's own /root/.secrets/carto.env. A host without
        # that file interpolates to empty, builds unkeyed URLs, and so gets
        # CARTO's watermarked tiles.
        # Declared in the base file so every environment builds the same way.
        VITE_CARTO_API_KEY: ${CARTO_API_KEY:-}
    env_file:
      - backend/.env
    volumes:
      - runtime-data:/app/data/runtime
    networks:
      retina-edge:
        aliases:
          - tower-finder-service
      # The edge container below reaches the app over this network rather than
      # over retina-edge, so this service's own ingress does not depend on
      # retina-server's network existing. The retina-edge attachment above stays
      # exactly as it was: retina-server's nginx still proxies /api/towers,
      # /api/elevation and /api/config to that alias, and that seam is the
      # intended permanent architecture.
      internal: {}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # This service's own TLS ingress, on a Cloudflare-supported HTTPS origin port.
  # It ships dark: nothing reaches it until a Cloudflare Origin Rule rewrites
  # the origin port for the hostname the fleet calls. See "Own ingress + the
  # flip plan" in README.md.
  edge:
    # Pinned to the minor so patch releases still arrive on a rebuild. The
    # official image is what renders deploy/nginx/edge.conf.template — its
    # entrypoint envsubsts /etc/nginx/templates/*.template, so there is no
    # custom renderer and no image to build here.
    image: nginx:1.31-alpine
    depends_on:
      - tower-finder-service
    ports:
      # All interfaces: Cloudflare connects from outside. Publishing it is what
      # makes the flip a Cloudflare-side change and nothing else.
      - "8443:8443"
    volumes:
      # Mounted under the name `default.conf.template` on purpose: the render
      # then overwrites the image's stock /etc/nginx/conf.d/default.conf instead
      # of sitting beside it and leaving a second server on :80.
      - ./deploy/nginx/edge.conf.template:/etc/nginx/templates/default.conf.template:ro
      # The same host path retina-server's nginx mounts: a Cloudflare origin
      # certificate for *.retina.fm plus the origin-pull CA. Read-only — this
      # container never writes there.
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      # The container-local plain-HTTP listener, not the TLS one: BusyBox wget
      # and a self-signed-to-everyone-but-Cloudflare certificate are a bad pair,
      # and an unreadable certificate stops nginx from starting at all, so it
      # cannot hide behind a passing check here.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_edge_health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  retina-edge:
    external: true
  internal:
    driver: bridge

volumes:
  runtime-data:
