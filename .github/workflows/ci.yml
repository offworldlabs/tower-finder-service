name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: /opt/tower-finder-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Unit tests
        run: pytest -m "not integration" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: E2E
        # Serves the built dist with `vite preview`; the specs mock /api
        # themselves, so this needs no backend and no FCC credentials.
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: tf-svc-deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_REF: ${{ github.sha }}
    steps:
      - name: Check required secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          test -n "$STAGING_HOST" || { echo "STAGING_HOST is not set"; exit 1; }
          test -n "$STAGING_SSH_KEY" || { echo "STAGING_SSH_KEY is not set"; exit 1; }
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR,DEPLOY_REF
          script: |
            set -euo pipefail
            # Three near-identical droplets share this workflow. A mis-set
            # secret would otherwise deploy the wrong one, silently.
            test "$(hostname)" = "retina-staging" || {
              echo "Refusing to deploy staging to $(hostname)"; exit 1; }
            cd "$APP_DIR"
            # Deploy the commit this run is for, not whatever origin/main points
            # at now, so a second merge landing mid-run cannot slip an untested
            # commit past staging's smoke test. Hard-reset rather than `git pull`:
            # pull aborts silently on a divergent branch (a local commit on the
            # server), the build then caches every layer because the source
            # "didn't change", and the new code never ships.
            git fetch origin "$DEPLOY_REF"
            git reset --hard FETCH_HEAD
            test -f backend/.env || {
              echo "backend/.env is missing; secrets would be lost"; exit 1; }
            cp deploy/env.staging.example .env
            # Top up with this host's own CARTO basemap key — see the note in
            # deploy/env.<env>.example. Guarded rather than chained with &&: a host
            # with no key must build watermarked tiles, not fail its deploy.
            if [ -f /root/.secrets/carto.env ]; then cat /root/.secrets/carto.env >> .env; fi
            # Syntax-check the new config before anything replaces the running edge:
            # a template nginx rejects would otherwise leave a crash-looping
            # container where a working one was. Uses the droplet's real
            # certificates, which `nginx -t` insists on reading.
            docker compose build edge
            docker compose run --rm --no-deps -T edge nginx -t
            docker compose up -d --build
            healthy=""
            for i in $(seq 1 12); do
              if docker compose exec -T tower-finder-service \
                python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Deploy healthy after ~$((i * 5))s"
                healthy=1
                break
              fi
              echo "Waiting for health check... attempt $i/12"
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "Health check failed after 60s"
              docker compose logs --tail=50 || true
              exit 1
            fi
            # The edge ships dark: nothing points at 8443 yet — the fleet still
            # arrives over retina-server's nginx on 443 — so the only way to
            # verify this listener before the Cloudflare Origin Rule flips is to
            # address it directly on the droplet, under the hostname it serves.
            # --resolve rather than DNS: every name resolves to Cloudflare, not to
            # the droplet, and this probe must reach the local listener directly.
            # An unverified peer needs a Cloudflare client certificate; this
            # probe is exempt because it arrives from the droplet itself.
            edge_ok=""
            for i in $(seq 1 12); do
              code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 \
                --resolve "staging-towers.retina.fm:8443:127.0.0.1" \
                "https://staging-towers.retina.fm:8443/api/health" || true)"
              if [ "$code" = "200" ]; then
                echo "Edge answered 200 on 8443 after ~$((i * 5))s"
                edge_ok=1
                break
              fi
              echo "Waiting for the edge on 8443... attempt $i/12 (last: ${code:-no answer})"
              sleep 5
            done
            if [ -z "$edge_ok" ]; then
              echo "Edge did not answer 200 on https://staging-towers.retina.fm:8443/api/health"
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            # The whole rendered config, not a sampled header: a header present
            # since the day it was added proves nothing about which config is
            # loaded. sed reproduces the entrypoint's envsubst exactly, because
            # TFS_EDGE_HOST is the template's only variable.
            sed 's|${TFS_EDGE_HOST}|staging-towers.retina.fm|g' deploy/nginx/edge.conf.template > /tmp/edge-expected.conf
            if ! docker compose exec -T edge cat /etc/nginx/conf.d/default.conf > /tmp/edge-running.conf; then
              echo "Could not read the edge's running config."
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            if ! diff -u /tmp/edge-expected.conf /tmp/edge-running.conf; then
              echo "The edge is serving a config this deploy did not render."
              exit 1
            fi
            # The document, not only the API: a frontend build that leaves no
            # index.html keeps /api/health at 200 while / becomes a 404.
            edge_doc="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 \
              --resolve "staging-towers.retina.fm:8443:127.0.0.1" "https://staging-towers.retina.fm:8443/" || echo unreachable)"
            if [ "$edge_doc" != "200" ]; then
              echo "The edge served / as $edge_doc."
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            # Verification runs against the container directly rather than over
            # staging's public hostname: the droplet-local path cannot be blurred
            # by Cloudflare caching and proves this deploy, not whatever the
            # edge in front of the name still routes to.
            EXPECT_ENV=staging bash deploy/smoke-local.sh

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test, frontend, deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: tf-svc-deploy-prod
      cancel-in-progress: false
    env:
      DEPLOY_REF: ${{ github.sha }}
    steps:
      - name: Check required secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not set"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is not set"; exit 1; }
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR,DEPLOY_REF
          script: |
            set -euo pipefail
            test "$(hostname)" = "retina-prod" || {
              echo "Refusing to deploy production to $(hostname)"; exit 1; }
            cd "$APP_DIR"
            git fetch origin "$DEPLOY_REF"
            git reset --hard FETCH_HEAD
            test -f backend/.env || {
              echo "backend/.env is missing; secrets would be lost"; exit 1; }
            cp deploy/env.prod.example .env
            # Top up with this host's own CARTO basemap key — see the note in
            # deploy/env.<env>.example. Guarded rather than chained with &&: a host
            # with no key must build watermarked tiles, not fail its deploy.
