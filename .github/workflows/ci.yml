            # container where a working one was. Uses the droplet's real
            # certificates, which `nginx -t` insists on reading.
            docker compose build edge
            docker compose run --rm --no-deps -T edge nginx -t
            docker compose up -d --build
            # `healthy` rather than an `exit 0` inside the loop: success has to
            # fall through to the edge probe below, which an early exit would
            # make dead code.
            healthy=""
            for i in $(seq 1 12); do
              if docker compose exec -T tower-finder-service \
                python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" 2>/dev/null; then
                echo "Deploy healthy after ~$((i * 5))s"
                healthy=1
                break
              fi
              echo "Waiting for health check... attempt $i/12"
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "Health check failed after 60s"
              docker compose logs --tail=50 || true
              exit 1
            fi
            # The edge ships dark: nothing points at 8443 yet — the fleet still
            # arrives over retina-server's nginx on 443 — so the only way to
            # verify this listener before the Cloudflare Origin Rule flips is to
            # address it directly on the droplet, under the hostname it serves.
            # --resolve rather than DNS: every name resolves to Cloudflare, not to
            # the droplet, and this probe must reach the local listener directly.
            # An unverified peer needs a Cloudflare client certificate; this
            # probe is exempt because it arrives from the droplet itself.
            edge_ok=""
            for i in $(seq 1 12); do
              code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 \
                --resolve "towers.retina.fm:8443:127.0.0.1" \
                "https://towers.retina.fm:8443/api/health" || true)"
              if [ "$code" = "200" ]; then
                echo "Edge answered 200 on 8443 after ~$((i * 5))s"
                edge_ok=1
                break
              fi
              echo "Waiting for the edge on 8443... attempt $i/12 (last: ${code:-no answer})"
              sleep 5
            done
            if [ -z "$edge_ok" ]; then
              echo "Edge did not answer 200 on https://towers.retina.fm:8443/api/health"
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            # The whole rendered config, not a sampled header: a header present
            # since the day it was added proves nothing about which config is
            # loaded. sed reproduces the entrypoint's envsubst exactly, because
            # TFS_EDGE_HOST is the template's only variable.
            sed 's|${TFS_EDGE_HOST}|towers.retina.fm|g' deploy/nginx/edge.conf.template > /tmp/edge-expected.conf
            if ! docker compose exec -T edge cat /etc/nginx/conf.d/default.conf > /tmp/edge-running.conf; then
              echo "Could not read the edge's running config."
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            if ! diff -u /tmp/edge-expected.conf /tmp/edge-running.conf; then
              echo "The edge is serving a config this deploy did not render."
              exit 1
            fi
            # The document, not only the API: a frontend build that leaves no
            # index.html keeps /api/health at 200 while / becomes a 404.
            edge_doc="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 30 \
              --resolve "towers.retina.fm:8443:127.0.0.1" "https://towers.retina.fm:8443/" || echo unreachable)"
            if [ "$edge_doc" != "200" ]; then
              echo "The edge served / as $edge_doc."
              docker compose logs --tail=50 edge || true
              exit 1
            fi
            # Which of three near-identical stacks answered, and the one thing
            # the public smoke cannot establish: retina-server's
            # towers.retina.fm vhost forwards only the tower paths here, so
            # /api/health on 443 is its own backend's and carries no environment.
            edge_env="$(curl -sk --max-time 10 \
              --resolve "towers.retina.fm:8443:127.0.0.1" \
              "https://towers.retina.fm:8443/api/health" \
              | sed -n 's/.*"environment"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' || true)"
            if [ "$edge_env" != "prod" ]; then
              echo "Edge on 8443 reports environment '${edge_env:-?}', expected 'prod'"
              docker compose logs --tail=50 || true
              exit 1
            fi
            echo "Edge on 8443 reports environment prod"

  smoke-prod:
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test production
        env:
          BASE_URL: https://towers.retina.fm
        run: bash deploy/smoke-test.sh

  deploy-test:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    # Dispatch only: retina-test is for rehearsing a change, not for every merge.
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: tf-svc-deploy-test
      cancel-in-progress: false
    env:
      DEPLOY_REF: ${{ github.sha }}
    steps:
      - name: Check required secrets
        env:
          TEST_HOST: ${{ secrets.TEST_HOST }}
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
        run: |
          test -n "$TEST_HOST" || { echo "TEST_HOST is not set"; exit 1; }
          test -n "$TEST_SSH_KEY" || { echo "TEST_SSH_KEY is not set"; exit 1; }
      - name: Deploy to test via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_HOST }}
          username: root
          key: ${{ secrets.TEST_SSH_KEY }}
          command_timeout: 20m
          envs: APP_DIR,DEPLOY_REF
          script: |
            set -euo pipefail
            test "$(hostname)" = "retina-test" || {
              echo "Refusing to deploy test to $(hostname)"; exit 1; }
            cd "$APP_DIR"
            # Dispatching from a feature branch rehearses that branch, which is
            # the whole point of this environment.
            git fetch origin "$DEPLOY_REF"
            git reset --hard FETCH_HEAD
            test -f backend/.env || {
              echo "backend/.env is missing; secrets would be lost"; exit 1; }
            cp deploy/env.test.example .env
            # Top up with this host's own CARTO basemap key — see the note in
            # deploy/env.<env>.example. Guarded rather than chained with &&: a host
            # with no key must build watermarked tiles, not fail its deploy.
