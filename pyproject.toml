[project]
name = "tower-finder-service"
version = "0.1.0"
description = "FastAPI service that ranks broadcast towers near a node from FCC + Maprad data."
# The interpreter CI and the image run, so the lock is solved for it alone.
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "shapely>=2.0",
  # Declared, not inherited: shapely pulls numpy in transitively today, and the
  # detection-area scoring imports it directly. A shapely release that drops
  # the dependency would otherwise break the tower endpoint, not the geometry.
  "numpy>=1.26",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  # Upper bound deliberate: ruff 0.16 widened the default rule set (I, SIM,
  # BLE, ASYNC, LOG among them) and the repo picks up 30 findings under it that
  # 0.15 does not raise. Unpinned, CI would have started failing on unrelated
  # lint the next time it ran, which is what it did. Adopting 0.16 and clearing
  # those is tracked separately.
  "ruff>=0.4,<0.16",
  "pyyaml>=6",
]

# An application run from its source tree, not a distribution: uv installs its
# dependencies and never the service itself. Imports resolve through the
# image's PYTHONPATH and, under pytest, the pythonpath below.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires the tower fixture (run capture_fixture.py first)",
]

[tool.ruff]
line-length = 120
